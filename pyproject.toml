[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# The name "agentether" is TAKEN on PyPI (an unrelated project, v0.1.2), so
# the distribution is published as "agentether".  The import package stays
# "agentether".  Both spellings were checked on PyPI and on GitHub:
# "agentether", "agentether", "agentether-lite", "agentether-lite"
# and "agentether-core" are all free at the time of writing.
[project]
name = "agentether"
version = "0.2.0"
description = "A tiny supervisor for LLM agent steps: verified claims, semantic loop detection and a human-editable Markdown project memory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "agent", "supervisor", "verification", "reliability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []
authors = [{ name = "Abderrahime BENMESSAHEL" }]
maintainers = [{ name = "Abderrahime BENMESSAHEL" }]
[project.urls]
Homepage = "https://github.com/abderrahimebenmessahel/agentether"
Repository = "https://github.com/abderrahimebenmessahel/agentether"
Issues = "https://github.com/abderrahimebenmessahel/agentether/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
openai = ["openai>=1.40"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "hypothesis>=6.100",
    "build>=1.2",
    "twine>=5.1",
]

[project.scripts]
agentether = "agentether.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentether = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["src/agentether"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mutmut]
# The mutation testing run of the audit: the two modules where a mistake
# would be a security problem.
source_paths = [
    "src/agentether/verifier.py",
    "src/agentether/state_manager.py",
]
pytest_add_cli_args_test_selection = ["tests"]
timeout = 120
debug = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]
# Virtual environments live inside the checkout in some workflows; they are
# not part of the project and must never be linted.
exclude = [".venv*", "venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "examples"]
warn_unreachable = true
disallow_any_explicit = false
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src", "tests", "benchmarks"]

[[tool.mypy.overrides]]
module = [
    "conftest",
    "test_benchmark",
    "test_cli",
    "test_parser",
    "test_state_manager",
    "test_orchestrator",
    "tests.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
