name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Pytest with coverage
        run: pytest --cov=src/agentether --cov-report=term-missing --cov-report=xml

      - name: Benchmark smoke run
        run: python -m agentether benchmark --trials 20 --seed 0

      - name: Upload the coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  # The audit is informational: it never blocks a merge, because a finding in
  # a transitive dependency is not necessarily a finding in this project.
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pip-audit (non blocking)
        run: |
          pip install pip-audit
          pip-audit --strict --progress-spinner off || true
      - name: Write the report
        run: |
          pip-audit --progress-spinner off --format json > pip-audit.json || true
          echo "pip-audit report written to pip-audit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: pip-audit.json
          if-no-files-found: ignore
